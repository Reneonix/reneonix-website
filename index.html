<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reneonix</title>
    <meta
      name="description"
      content="Reneonix is a material circularity deeptech company that transforms fragmented post-consumer waste into traceable, industry-ready raw materials."
    />
    <link rel="canonical" href="https://www.reneonix.com/" />
    <link rel="icon" type="image/svg+xml" href="/reneonix-favicon.svg" />
    <link rel="apple-touch-icon" href="/reneonix-favicon.svg" />

    <!-- Default Open Graph / Twitter card — App.jsx overwrites these per
         route once JS runs; these are the fallback any crawler or link
         scraper that doesn't execute JS will see. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Reneonix" />
    <meta property="og:title" content="Reneonix | Engineering the Next Generation of Material Circularity" />
    <meta property="og:description" content="Reneonix is a material circularity deeptech company that transforms fragmented post-consumer waste into traceable, industry-ready raw materials." />
    <meta property="og:image" content="https://www.reneonix.com/hardware-hero.png" />
    <meta property="og:url" content="https://www.reneonix.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Reneonix | Engineering the Next Generation of Material Circularity" />
    <meta name="twitter:description" content="Reneonix is a material circularity deeptech company that transforms fragmented post-consumer waste into traceable, industry-ready raw materials." />
    <meta name="twitter:image" content="https://www.reneonix.com/hardware-hero.png" />

    <!-- Organization structured data — static site-wide, doesn't change per
         route, so it lives here rather than in the per-route JS effect. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Reneonix",
        "url": "https://www.reneonix.com/",
        "logo": "https://www.reneonix.com/reneonix-logo-mark.svg",
        "description": "Reneonix is a material circularity deeptech company that transforms fragmented post-consumer waste into traceable, industry-ready raw materials."
      }
    </script>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-PQ7G6N4LPY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-PQ7G6N4LPY');
    </script>

    <!-- Preconnect: fonts & external image domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Upgrade to preconnect so the TCP+TLS handshake is ready before thumbnails load -->
    <link rel="preconnect" href="https://img.youtube.com" crossorigin />
    <link rel="dns-prefetch" href="https://img.youtube.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Arimo:wght@400;700;800;900&family=Inter:wght@400;500;600;700;800&family=Montserrat:wght@600;700;800;900&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Preload the hero background video so it starts buffering early on all devices. -->
    <link rel="preload" as="video" href="/reneonix-hero.mp4" />

    <!-- Preload the Reneonix logo so the preloader renders instantly -->
    <link rel="preload" as="image" href="/reneonix-logo-mark.svg" />

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
